name: preview

# A temporary environment for this pull request. The label "preview" deploys the Dev stage into the developer account.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    uses: jross24/lab-workflows/.github/workflows/preview.yml@feat/preview
    with:
      tools-ref: feat/preview
    secrets: inherit
